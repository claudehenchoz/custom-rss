[project]
name = "custom-rss"
version = "0.1.0"
description = "Deterministic RSS 2.0 feeds generated from publisher feeds and store catalogs."
requires-python = ">=3.13"
dependencies = ["feedparser>=6.0,<7"]

[project.scripts]
custom-rss = "custom_rss.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/custom_rss"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
