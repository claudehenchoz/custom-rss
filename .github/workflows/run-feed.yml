name: Run feed

on:
  workflow_call:
    inputs:
      feed:
        description: "Registered feed slug to run"
        required: true
        type: string
      force:
        description: "Bypass the job's own rate limit"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  TZ: UTC

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: custom-rss-${{ inputs.feed }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
          enable-cache: true

      - run: uv sync --frozen

      - name: Run feed job
        id: run
        env:
          FORCE: ${{ inputs.force && '--force' || '' }}
        run: uv run --frozen custom-rss run "${{ inputs.feed }}" $FORCE

      # Runs even if the fetch failed, so Game Pass failure audit rows are kept.
      # The job still ends red because steps.run failed.
      - name: Commit feed changes
        if: always() && steps.run.outcome != 'skipped'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "feeds/${{ inputs.feed }}"
          if git diff --cached --quiet; then
            echo "No feed changes"
            exit 0
          fi
          git commit -m "Update ${{ inputs.feed }} feed"
          for attempt in 1 2 3; do
            git pull --rebase origin "${{ github.ref_name }}"
            if git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying" >&2
          done
          echo "Failed to push after 3 attempts" >&2
          exit 1
