name: Game Pass feed

on:
  workflow_dispatch:
    inputs:
      force:
        description: "Fetch even if already fetched successfully today"
        type: boolean
        default: false
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write

jobs:
  update:
    uses: ./.github/workflows/run-feed.yml
    with:
      feed: gamepass
      force: ${{ inputs.force || false }}
    permissions:
      contents: write
